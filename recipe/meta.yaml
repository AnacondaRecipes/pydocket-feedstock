{% set name = "pydocket" %}
{% set version = "0.19.2" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz
  sha256: 6cf58610685ad7cc5e5174db39435c64dc485e545186d0523c7f5526d2a4469e

build:
  number: 0
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  entry_points:
    - docket = docket.__main__:app

requirements:
  host:
    - python
    - pip
    - hatchling
    - hatch-vcs
  run:
    - python
    - cachetools >=5.0.0
    - cloudpickle >=3.1.1
    - cronsim >=2.6
    - exceptiongroup >=1.2.0  # [py<311]
    - fakeredis >=2.35.0
    # fakeredis[lua]
    - lupa >=2.0
    - taskgroup >=0.2.2  # [py<311]
    - opentelemetry-api >=1.33.0
    - prometheus_client >=0.21.1
    - py-key-value-aio >=0.3.0
    - python-json-logger >=2.0.7
    - redis-py >=5
    - rich >=13.9.4
    - typer >=0.15.1
    - typing-extensions >=4.12.0
    - python-tzdata >=2025.2  # [win]
    - uncalled-for >=0.2.0
  run_constrained:
    - opentelemetry-sdk >=1.33.0  # metrics

test:
  imports:
    - docket
  requires:
    - pip
  commands:
    - pip check
    - docket --help

about:
  home: https://docket.lol/
  license: MIT
  license_family: MIT
  license_file: LICENSE
  summary: A distributed background task system for Python functions
  description: |
    Docket is a distributed background task system for Python functions with a
    focus on scheduling future work. It requires a Redis server with Streams
    support (Redis 5.0.0+).
  dev_url: https://github.com/chrisguidry/docket
  doc_url: https://docket.lol/en/latest/

extra:
  recipe-maintainers:
    - chrisguidry
    - zzstoatzz
